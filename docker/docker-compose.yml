# 记忆层（core/memory）依赖的两个本地数据库：Qdrant（向量）+ TigerGraph（图）。
#
# 启动：docker compose -f docker/docker-compose.yml up -d
# 停止：docker compose -f docker/docker-compose.yml down
#
# 数据落在 ../data/memory/ 下（已在 .gitignore 里忽略，不入库）。
# 端口与密钥可在同目录的 .env 中覆盖，参考 .env.example。
# 两个库对外的地址要与 data/config/cosmos.yaml 的 memory 段保持一致。

name: aliya-cosmos-memory

services:
  qdrant:
    image: qdrant/qdrant:latest # 生产建议锁定具体版本，例如 qdrant/qdrant:v1.x.y
    container_name: aliya-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333" # REST 接口与 Web UI，对应 memory.qdrant.url
      - "${QDRANT_GRPC_PORT:-6334}:6334" # gRPC 接口，AsyncQdrantClient 可走这条
    volumes:
      - ../data/memory/qdrant:/qdrant/storage
    environment:
      # 默认不传 API Key，即本地无鉴权。开启鉴权时取消注释，并让 .env 的
      # QDRANT_API_KEY 与 cosmos.yaml 的 memory.qdrant.api_key 取同一个值。
      # QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-}
      QDRANT__LOG_LEVEL: ${QDRANT_LOG_LEVEL:-INFO}
    healthcheck:
      # 镜像自带 bash，用 /dev/tcp 探端口，避免依赖 curl。
      test: ["CMD", "bash", "-c", ":> /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  tigergraph:
    # 官方镜像走 Docker Hub；拉不动时从 https://dl.tigergraph.com/ 下载 tar 包，
    # docker load -i 后把 image 改成加载出来的 tag。
    image: tigergraph/community:${TIGERGRAPH_VERSION:-4.2.2}
    container_name: aliya-tigergraph
    restart: unless-stopped
    tty: true # 容器内 gadmin 需要 TTY，与服务里 -itd 的 -t 对应
    stdin_open: true
    ports:
      - "${TIGERGRAPH_SSH_PORT:-14022}:22" # SSH：进容器跑 gadmin / gsql
      - "${TIGERGRAPH_RESTPP_PORT:-9000}:9000" # REST++：图查询
      - "${TIGERGRAPH_STUDIO_PORT:-14240}:14240" # GSQL server / GraphStudio，对应 memory.tigergraph.base_url
    volumes:
      # 只持久化数据目录；如需连配置与 license 一起留存，改挂整个
      # /home/tigergraph/tigergraph（注意别覆盖镜像自带内容）。
      - ../data/memory/tigergraph:/home/tigergraph/tigergraph/data
    ulimits:
      # 官方要求：图查询会打开大量文件句柄。
      nofile:
        soft: 1000000
        hard: 1000000
    healthcheck:
      # 首次启动要初始化图库（较慢），故给足 start_period；只探 REST++ 端口。
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 300s
    # 镜像自带社区版 license；如需企业版，进入容器执行
    #   gadmin license set <license_key> && gadmin restart
