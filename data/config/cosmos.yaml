# 配置骨架：只列常改项，缺的字段一律用 core/config/settings.py 里的默认值。
# 占位符（取值来源是进程环境变量与 .env，进程环境优先）：
#   ${VAR}        取不到就报错退出（写密钥时要确认 .env 里有值）
#   ${VAR:默认值} 取不到时用默认值；冒号后留空即默认空串
#   $$            字面 $，例如 $${RAW} 会展开成 ${RAW}
#   默认只展开一趟：变量值里再写 ${...} 不会继续展开，避免链式取值的隐式依赖；
#   确需链式时由 load_settings(expand_rounds=2) 开启（见 README「占位符」）。

app:
  app_name: aliya-cosmos # 应用名，启动 / 关闭日志与健康检查都用它
  env: dev # 运行环境：dev / test / prod
  debug: true # 调试开关

log:
  level: DEBUG # TRACE / DEBUG / INFO / SUCCESS / WARNING / ERROR / CRITICAL，大小写不敏感
  json: false # true 则输出 JSON 行，便于采集端直接解析
  layout: line # line（默认，字段内联成一行，便于 grep 与按行采集）/ tree（字段缩进成树）
  color: auto # 控制台着色：auto（仅终端）/ always / never；日志文件永远不带颜色
  dir: logs # 日志目录，相对当前工作目录
  # 文件名支持 loguru 时间模板，装配时求值 → 每次启动写一组独立文件。
  # 保留 {…} 占位符不只是命名方便：loguru 的 retention 靠它识别同族文件，
  # 写成固定名（app.log）时旧文件永远清不掉。
  # 两个名字的前缀不能互为包含关系：主日志的反查 glob 会把以它为前缀的
  # 错误日志一起匹配进来（详见 core/logger/sinks.py::_session_path）。
  file_name: "cosmos-main-{time:%Y%m%d-%H%M%S}.log"
  error_file_name: "cosmos-error-{time:%Y%m%d-%H%M%S}.log"
  rotation: "00:00" # 轮转阈值（默认按天）；不加引号会被 YAML 当成整数 0
  retention: 7 days # 保留时长，超期文件自动清理
  compression: zip # 轮转出的旧文件压缩格式

service:
  start_timeout: 30 # 单个服务 start() 的超时秒数，必须为正数；null 表示不限制
  stop_timeout: 30 # 单个服务 stop() 的超时秒数，必须为正数；同上

clock:
  tz: Asia/Shanghai # 时钟服务的时区，如 Asia/Shanghai；非法时区在启动期报错

# 文本向量化端点。与 llm 分开配：DeepSeek 没有 embedding 端点，两家通常不是同一个服务。
# 没配 api_key 时只警告、健康检查 unhealthy，进程照常启动（不 fail fast）。
embedding:
  base_url: http://127.0.0.1:9080/v1 # OpenAI 兼容端点
  # 本地 llama.cpp 不校验鉴权，但服务层要求 api_key 非空才建内核； api_key=local
  api_key: ${EMBEDDING_API_KEY:local} # 非空占位，本地端点直接接受
  model: Qwen3-Embedding-4B-Q4_K_M # 向量化模型
  timeout: 60 # 单次请求超时（秒），必须为正数
  retries: 2 # SDK 重试次数，0 关闭
  batch_size: 10 # 单次请求最多几条文本。阿里 v3 上限 10（v1/v2 为 25，OpenAI 为 2048），超了会 400
  dimensions: null # null = 用模型原始维度（v3 默认 1024）；设值则请求截断，做不到的模型会报错

# chat 与 vision 是两个端点，字段相同：可以指向同一个服务，也可以分开接不同供应商。
# 两个端点都没配 api_key 时，服务只警告、健康检查 unhealthy，进程照常启动（不 fail fast）。
llm:
  chat:
    base_url: https://api.deepseek.com/v1 # 端点地址；OpenAI 兼容端点（vLLM / Ollama / Moonshot）改这里即可
    api_key: ${DEEPSEEK_API_KEY:} # 冒号后为空：.env 里没配时取空串，该端点不可用
    model: deepseek-flash # 该端点的模型
    timeout: 60 # 单次请求超时（秒），必须为正数
    retries: 2 # SDK 重试次数，0 关闭；流式一旦开始消费就不再重试
    structured_mode: json_object # 兼容端点不支持时改 json_object（该模式要求提示词里出现 json 字样）
    temperature: null # null = 不传该参数，用服务端默认；传值则覆盖
    max_tokens: null # 同上。结构化输出建议给值，避免输出被截断
  vision:
    # 多模态走这个端点：调用时显式传 endpoint="vision" 才切过来（不按 model 名自动切换）。
    # 本端点没配 api_key 时只是它自己不可用，不指定 endpoint 的调用仍走 chat。
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout: 60
    retries: 2
    structured_mode: json_object
    temperature: null
    max_tokens: null
# 判断层：jev（云端）与 laya（本地 laya-serve）是两个端点，同一套 /systemone 协议。
# base_url 只写到 /v1 为止，路径 /systemone 由代码补上，多写一段会 404。
# 两个端点默认都关着：进程照常启动（不 fail fast），调用时才报未启用。
decision:
  jev:
    enabled: false
    base_url: https://api.typesafe.ai/v1 # 官方云端端点
    api_key: ${TYPESAFE_API_KEY:} # 冒号后为空：.env 里没配时不发 Authorization 头
    model: jev-latest # 该端点必填，Jev 不接受空 model
    timeout: 60 # 单次请求超时（秒），必须为正数
    retries: 2 # 429/502/503/504/529 的退避重试次数，0 关闭
    max_connections: null # 连接池上限；null = httpx2 默认（并发 predict_many 时压住连接数）
  laya:
    enabled: false
    base_url: http://127.0.0.1:8000/v1 # 本地 laya-serve，默认监听 0.0.0.0:8000
    api_key: ${LAYA_API_KEY:} # laya-serve 未设 LAYA_API_KEY 时留空即可
    model: "" # 空 = 不带 model 字段，交给 Laya 的 Router 按语种自动选 checkpoint
    timeout: 60
    retries: 2
    max_connections: null # 连接池上限；null = httpx2 默认（并发 predict_many 时压住连接数）

# ============================================================================
# cosmos 主 agent（设计见 agent/cosmos/docs/）
# 只放常改项，其余字段用 core/config/settings.py 里的默认值。
# 未知键在加载期 WARNING 并忽略，不会阻断启动；改完建议跑一次配置校验/测试。
# ============================================================================
agent:
  # 控制面：cosmos 的 UDS 服务端与 Aliya 客户端读同一份。
  control:
    socket_path: data/state/aliya.sock
    token_env: ALIYA_CONTROL_TOKEN
    max_clients: 1
    request_timeout: 15
    outbox_limit: 200
    max_line_bytes: 1048576
  # Aliya 自己的意愿、记忆与回复策略；通道侧的节流仍由 cosmos.terminal 执行。
  aliya:
    persona:
      source: data/prompt/Aliya.md
      charter: data/prompt/Aliya.charter.md
    memory:
      dir: data/Aliya
      anchors: [风信子, 拉姆石, 高马尾, 兔子狗, 海獭号]
      open_topics_limit: 5
      private_threads: true
    initiative:
      enabled: true
      tick_seconds: 60
      min_gap_seconds: 3600
      daily_soft_limit: 4
    reply:
      max_rounds: 6
      turn_timeout_seconds: 120
    tools:
      mcp_enabled: true # 接入 data/mcp.json 里的外部工具；空的 mcpServers 不连任何 server
      skills_enabled: true # 加载 data/skills/*/SKILL.md，只披露索引，正文按需读取
    world:
      consume: true
      max_hypotheses_used: 2
      trust_threshold: 0.5
  cosmos:
    # ---------- 契约 ----------
    contract:
      api_version: "1.0" # 主版本不一致直接拒绝连接，不做兼容猜测
      contract_version: "1.0.0" # 契约模型版本；Aliya 侧只校验主版本
      state_dir: data/state # 桌面布局、统计、轨迹等运行数据；已被 .gitignore 忽略
    # ---------- 通讯链路 ----------
    link:
      heartbeat_seconds: 30 # 超过此时长没有心跳判 unstable
      down_after_seconds: 90 # 超过此时长判 down；down 期间消息进队列
      queue_limit: 1000 # 中断期积压上限，超出丢弃最旧并告警
      replay_on_recover: true # 链路恢复后重放积压消息
      suppress_proactive_when_down: true # 断链时抑制主动消息，避免恢复后刷屏
    # ---------- 调度 ----------
    dispatch:
      mode: suggest # suggest（默认，交 Aliya 确认）/ auto（高置信度直接执行）
      auto_threshold: 0.75 # auto 模式的最低置信度
      min_confidence: 0.6 # 低于此值转 clarify，不硬上
      high_threshold: 0.9 # 一级检索达到此分数时跳过模型精排
      max_candidates: 5 # 精排时最多给模型几张卡片
      max_parallel: 3 # 整批并发上限
      dedupe_window_seconds: 60 # 幂等去重窗口
      plan_timeout_seconds: 5 # plan 调用超时
      match_fallback_on_error: true # 匹配模型失败时回退到检索结果
    # ---------- 桌面 ----------
    desktop:
      groups: # 分组顺序即面板展示顺序
        - {key: dev, title: 开发工具, order: 10}
        - {key: web, title: 联网, order: 20}
        - {key: media, title: 内容处理, order: 30}
        - {key: general, title: 通用, order: 90}
      progress_throttle_ms: 1000 # 进度事件尾沿节流，避免高频刷新
      reconcile_seconds: 30 # 全量对账周期
      max_content_chars: 2000 # 单条回传文本上限，超出按段落分段
      history_limit: 5 # 单卡详情里的最近任务数
    # ---------- 用户状态 ----------
    presence:
      enabled: true # false 时 get_presence() 返回 unknown 快照
      ttl_seconds: 30 # 超过此时长的快照标 stale
      idle_after_seconds: 300 # online → away
      offline_after_seconds: 900 # away → offline
      panel:
        show_mood: false # 情绪默认不进常驻面板（对等隐私）
        show_device: false # 设备信息默认不展示
        aliya_can_hide: true # Aliya 可要求关闭任一字段
    # ---------- 通信终端 ----------
    terminal:
      conversation_turns: 20 # 信封里携带的最近轮次
      summary_chars: 400 # 更早内容的摘要长度上限
      context_max_tokens: 4000 # 上下文预算；超限先摘要再裁剪
      summary_batch_turns: 4 # 每积累几轮旧内容压一次摘要
      session_ttl_hours: 72 # 空闲会话回收
      max_sessions: 200 # 会话数上限；超出按最久未活跃回收
      pinned_fact_ttl_days: 30 # 偏好/约束等固定事实保留天数
      max_parts: 12 # 单条回复最多分段数
      segment_hard_max_chars: 4000 # 代码块/URL 的硬上限
      unanswered_notice: true # 是否向 Aliya 暴露 unanswered_count；false 时传 0
      delivery:
        retry: 3 # 出站投递失败后的重试次数
        retry_backoff_seconds: 2 # 指数退避基数
        dead_letter: true # 重试耗尽后写 dead_letters.jsonl
      redaction: # 出站前的脱敏开关；默认全开
        mask_agent_ids: true
        mask_task_ids: true
        mask_dispatch_ids: true
        mask_error_types: true
        mask_stack: true
        mask_secrets: true
        mask_pii: true
        warn_on_hit: true # 命中脱敏规则时告警，便于发现上游泄漏
      proactive:
        enabled: true # false 时只能被动回复
        min_interval_seconds: 3600 # 两条主动消息的最小间隔
        daily_limit: 6 # 每日硬上限；urgency 也不能突破
        hourly_limit: 2 # 每小时普通打扰预算；urgency>=0.8 可突破，仍受每日上限约束
        history_window_days: 14 # 历史画像窗口；太短不稳，太长反应慢
        reply_window_minutes: 30 # 超过这个时间回话不算「有回应」
        # 默认不设免打扰：人设里她会失眠、熬夜刷信息、睡不着时找人说话。
        # 需要时再填，例如 ["23:30-07:30"]，按用户时区；被拦消息进延迟队列，不丢弃。
        quiet_hours: []
    # ---------- 世界推理 ----------
    world:
      enabled: true # 规则基线端口已内置；false 时仍启动但不触发
      # 端口 = 模块路径 + 无参工厂；enabled=true 且两者缺失时启动期报错。
      port_module: agent.cosmos.world.reasoning # 可替换成 LLM 端口
      port_factory: build # 工厂函数：无参调用，返回 WorldReasoningPort
      infer_timeout_seconds: 10 # 单次推演超时；超时保留旧结果并标 stale
      ttl_seconds: 600 # 结果缓存与 stale 判定共用这个时长
      failure_backoff_seconds: 300 # 连续 3 次失败后暂停，避免持续打爆端口
      max_hypotheses: 3 # 最多保留 3 条；端口多给会被截断并 WARNING
      history:
        window_days: 14 # 世界推理历史窗口；装配时传给终端统计
        min_sample_days: 3 # 少于 3 天不采信 active_hours，防止冷启动误判
      triggers:
        presence_change: true # 在线状态翻转：最值得立即推演的事件
        dispatch_finished: true # 任务结束触发；false 时忽略 dispatch.finished
        silence_thresholds_minutes: [30, 120, 360] # 静默跨过这些分钟数各触发一次
        user_message: false # 用户正在对话，推演反而添乱
        # 显著性门控：低于阈值的事件直接丢弃，不进合并窗口。
        min_salience: 0.35
        high_salience_window_seconds: 30 # 越接近 1 窗口越短，最短 30s
        low_salience_window_seconds: 300 # 低显著事件最长等待 300s
        reconcile_seconds: 600 # 定时对账，只兜底不承担主触发
        model_path: null # 校准后可指向 data/state/world_trigger_model.json；损坏自动退回规则
      calibration:
        # 离线校准报告存在时，启动期自动回填 temperature / min_salience
        report_path: data/state/world_calibration.json
      policy:
        horizon: 2 # 两步前瞻；当前实现最多 3 步
        discount: 0.8 # 前瞻折扣；越小越短视
      fast_path:
        enabled: true # 冷启动/深路超时时先给保守结论，随后按 revision 覆盖
        confidence_cap: 0.45 # 快路置信度上限，避免和深路抢结论
      belief:
        enabled: true # false 时每轮从零推断，只保留结果快照
        observation_weight: 0.6 # 0=完全信旧信念，1=完全信本轮观测
      trace_enabled: true # 关闭后不写轨迹，离线校准/回放不可用
      trace_max_bytes: 5000000 # world_trace.jsonl 超过后轮转为 .1
    # 运行期注册默认关闭；Aliya 无权开启，只能读已注册工具。
    allow_runtime_registration: false
    # 子 agent 注册示例：module/handler 指向实现，card 是 AgentCard 的 YAML 形态。
    agents:
      - id: echo
        module: agent.cosmos.registry.echo
        handler: handle
        card:
          name: 回声台
          icon: "🔁"
          summary: 原样返回收到的指令
          description: >-
            联调用的最小工具：把收到的文本原样返回，用来验证调度、进度与结果链路。
            不做任何文件操作，也不承担真实业务。
          capabilities: [echo]
          params_schema:
            type: object
            properties:
              text: {type: string}
            required: [text]
          examples:
            - input: 帮我回显一句话
          desktop: {group: general, order: 100, pinned: false, visible: true}
          execution: {timeout_seconds: 30, max_concurrent: 1, queue: true}
          permissions: {read_presence: false, notify_user: false, read_conversation: false}
      # ---------- 真实业务工具 ----------
      # 路径沙箱、敏感文件拦截与写入上限都在各 handler 内部实现（08 章 7 节）。
      - id: edit
        module: agent.cosmos.registry.edit
        handler: handle
        card:
          name: 编辑台
          icon: "✏️"
          summary: 改写工作区里的文件
          description: >-
            在 Aliya 的工作区（data/Aliya/workspace）内修改文本文件：
            write 整文件覆盖、append 追加、replace 精确替换。
            不做工作区外操作，不执行命令，不提交 git；replace 找不到原文时不写入任何内容。
          capabilities: [file_write, file_edit, code_edit]
          params_schema:
            type: object
            properties:
              action: {type: string, enum: [write, append, replace]}
              path: {type: string}
              content: {type: string}
              old: {type: string}
              new: {type: string}
              count: {type: integer, minimum: 1}
            required: [action, path]
          examples:
            - input: 新建一个 notes/todo.md，写上三条待办
            - input: 把笔记里那句过时的话改掉
          desktop: {group: dev, order: 10, pinned: false, visible: true}
          execution: {timeout_seconds: 60, max_concurrent: 1, queue: true, retryable: true}
          permissions: {read_presence: false, notify_user: false, read_conversation: false}
      - id: search
        module: agent.cosmos.registry.search
        handler: handle
        card:
          name: 检索台
          icon: "🔍"
          summary: 在工作区里找文件或内容
          description: >-
            在 Aliya 的工作区（data/Aliya/workspace）内按文件名或正文查找：
            mode=files 匹配文件名，mode=content 匹配文件内容。
            只读，不改文件、不执行命令；跳过依赖、缓存与版本库目录，不返回二进制内容。
          capabilities: [file_search, code_search]
          params_schema:
            type: object
            properties:
              query: {type: string}
              mode: {type: string, enum: [content, files]}
              path: {type: string}
              glob: {type: string}
              max_results: {type: integer, minimum: 1, maximum: 100}
            required: [query]
          examples:
            - input: 找一下笔记里提到的 TODO
            - input: 列出所有 md 文件
          desktop: {group: dev, order: 20, pinned: false, visible: true}
          execution: {timeout_seconds: 60, max_concurrent: 2, queue: true, retryable: true}
          permissions: {read_presence: false, notify_user: false, read_conversation: false}
      - id: run
        module: agent.cosmos.registry.run
        handler: handle
        card:
          name: 运行台
          icon: "⚙️"
          summary: 在工作区里跑测试与命令
          description: >-
            在 Aliya 的工作区（data/Aliya/workspace）内执行白名单命令并返回输出：
            pytest、ruff check、python -m、uv run 与 git 只读查询。
            cwd 与参数都不能指向工作区外；不接受安装、发布、推送、删除类操作；超时终止整个进程组。
          capabilities: [run_tests, run_command, lint]
          params_schema:
            type: object
            properties:
              command: {type: string}
              cwd: {type: string}
              timeout_seconds: {type: integer, minimum: 1, maximum: 300}
            required: [command]
          examples:
            - input: 跑一下工作区里的测试
            - input: 对工作区里的文件跑 ruff 检查
          desktop: {group: dev, order: 30, pinned: false, visible: true}
          execution: {timeout_seconds: 300, max_concurrent: 1, queue: true, retryable: true}
          permissions: {read_presence: false, notify_user: false, read_conversation: false}
      - id: web
        module: agent.cosmos.registry.web
        handler: handle
        card:
          name: 联网台
          icon: "🌐"
          summary: 抓取公开网页正文
          description: >-
            抓取一个公开网页并转成纯文本，适合读文章、文档与公告。
            不支持登录、提交表单、下载文件；只访问公网地址，拒绝本机与内网。
          capabilities: [web_fetch, read_page]
          params_schema:
            type: object
            properties:
              url: {type: string}
              max_chars: {type: integer, minimum: 200, maximum: 20000}
            required: [url]
          examples:
            - input: 读一下这篇公告的内容
            - input: 把这个文档页面的正文抓下来
          desktop: {group: web, order: 10, pinned: false, visible: true}
          execution: {timeout_seconds: 60, max_concurrent: 2, queue: true, retryable: true}
