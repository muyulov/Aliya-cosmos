# 配置骨架：只列常改项，缺的字段一律用 core/config/settings.py 里的默认值。
# 占位符（取值来源是进程环境变量与 .env，进程环境优先）：
#   ${VAR}        取不到就报错退出（写密钥时要确认 .env 里有值）
#   ${VAR:默认值} 取不到时用默认值；冒号后留空即默认空串
#   $$            字面 $，例如 $${RAW} 会展开成 ${RAW}
#   默认只展开一趟：变量值里再写 ${...} 不会继续展开，避免链式取值的隐式依赖；
#   确需链式时由 load_settings(expand_rounds=2) 开启（见 README「占位符」）。

app:
  app_name: aliya-cosmos # 应用名，启动 / 关闭日志与健康检查都用它
  env: dev # 运行环境：dev / test / prod
  debug: true # 调试开关

log:
  level: INFO # TRACE / DEBUG / INFO / SUCCESS / WARNING / ERROR / CRITICAL，大小写不敏感
  json: false # true 则输出 JSON 行，便于采集端直接解析
  layout: line # line（默认，字段内联成一行，便于 grep 与按行采集）/ tree（字段缩进成树）
  color: auto # 控制台着色：auto（仅终端）/ always / never；日志文件永远不带颜色
  dir: logs # 日志目录，相对当前工作目录
  # 文件名支持 loguru 时间模板，装配时求值 → 每次启动写一组独立文件。
  # 保留 {…} 占位符不只是命名方便：loguru 的 retention 靠它识别同族文件，
  # 写成固定名（app.log）时旧文件永远清不掉。
  # 两个名字的前缀不能互为包含关系：主日志的反查 glob 会把以它为前缀的
  # 错误日志一起匹配进来（详见 core/logger/sinks.py::_session_path）。
  file_name: "cosmos-main-{time:%Y%m%d-%H%M%S}.log"
  error_file_name: "cosmos-error-{time:%Y%m%d-%H%M%S}.log"
  rotation: "00:00" # 轮转阈值（默认按天）；不加引号会被 YAML 当成整数 0
  retention: 7 days # 保留时长，超期文件自动清理
  compression: zip # 轮转出的旧文件压缩格式

service:
  start_timeout: 30 # 单个服务 start() 的超时秒数，必须为正数；null 表示不限制
  stop_timeout: 30 # 单个服务 stop() 的超时秒数，必须为正数；同上

clock:
  tz: UTC # 时钟服务的时区，如 Asia/Shanghai；非法时区在启动期报错

# 文本向量化端点。与 llm 分开配：DeepSeek 没有 embedding 端点，两家通常不是同一个服务。
# 没配 api_key 时只警告、健康检查 unhealthy，进程照常启动（不 fail fast）。
embedding:
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1 # OpenAI 兼容端点
  api_key: ${DASHSCOPE_API_KEY:} # 冒号后为空：.env 里没配时取空串，该端点不可用
  model: text-embedding-v3 # 向量化模型
  timeout: 60 # 单次请求超时（秒），必须为正数
  retries: 2 # SDK 重试次数，0 关闭
  batch_size: 10 # 单次请求最多几条文本。阿里 v3 上限 10（v1/v2 为 25，OpenAI 为 2048），超了会 400
  dimensions: null # null = 用模型原始维度（v3 默认 1024）；设值则请求截断，做不到的模型会报错

# chat 与 vision 是两个端点，字段相同：可以指向同一个服务，也可以分开接不同供应商。
# 两个端点都没配 api_key 时，服务只警告、健康检查 unhealthy，进程照常启动（不 fail fast）。
llm:
  chat:
    base_url: https://api.deepseek.com/v1 # 端点地址；OpenAI 兼容端点（vLLM / Ollama / Moonshot）改这里即可
    api_key: ${DEEPSEEK_API_KEY:} # 冒号后为空：.env 里没配时取空串，该端点不可用
    model: deepseek-flash # 该端点的模型
    timeout: 60 # 单次请求超时（秒），必须为正数
    retries: 2 # SDK 重试次数，0 关闭；流式一旦开始消费就不再重试
    structured_mode: json_schema # 兼容端点不支持时改 json_object（该模式要求提示词里出现 json 字样）
    temperature: null # null = 不传该参数，用服务端默认；传值则覆盖
    max_tokens: null # 同上。结构化输出建议给值，避免输出被截断
  vision:
    # 多模态走这个端点：给 svc.chat 传 model=svc.vision_model 就切过来。
    # 本端点没配 api_key 时不会接管自己的模型，chat 调用不受影响。
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout: 60
    retries: 2
    structured_mode: json_schema
    temperature: null
    max_tokens: null
  memory:
    # 记忆专用端点：抽取与记忆块渲染走这里。
    # 与另两个端点不同，它只接受显式 endpoint="memory" 选择，不参与模型名匹配，
    # 因此 model 与 chat 同名也不会把 chat 调用抢走。
    # 这里只列常改项，其余字段（timeout / retries / structured_mode / temperature /
    # max_tokens）走 core/config/settings.py 里 LLMEndpointSettings 的代码默认值。
    base_url: ${MEMORY_LLM_BASE_URL:https://api.openai.com/v1}
    api_key: ${MEMORY_LLM_API_KEY:}
    model: gpt-4o-mini

# 判断层：jev（云端）与 laya（本地 laya-serve）是两个端点，同一套 /systemone 协议。
# base_url 只写到 /v1 为止，路径 /systemone 由代码补上，多写一段会 404。
# 两个端点默认都关着：进程照常启动（不 fail fast），调用时才报未启用。
decision:
  jev:
    enabled: false
    base_url: https://api.typesafe.ai/v1 # 官方云端端点
    api_key: ${TYPESAFE_API_KEY:} # 冒号后为空：.env 里没配时不发 Authorization 头
    model: jev-latest # 该端点必填，Jev 不接受空 model
    timeout: 60 # 单次请求超时（秒），必须为正数
    retries: 2 # 429/529 的退避重试次数，0 关闭
  laya:
    enabled: false
    base_url: http://127.0.0.1:8000/v1 # 本地 laya-serve，默认监听 0.0.0.0:8000
    api_key: ${LAYA_API_KEY:} # laya-serve 未设 LAYA_API_KEY 时留空即可
    model: "" # 空 = 不带 model 字段，交给 Laya 的 Router 按语种自动选 checkpoint
    timeout: 60
    retries: 2

# 记忆层（归忆）：Kùzu 一体存储（图 + 向量 + 全文），一库一世界。
memory:
  db_path: data/memory # Kùzu 数据库目录；换世界就是换这里
  dimensions: 1024 # 向量列维度 FLOAT[d]，建表时确定且不可变更，必须与嵌入端点实际返回一致
  queue_size: 256 # 观测队列上限，满则丢弃并记 ERROR（过载 ≠ 故障，不进死信）
  gate:
    backend: laya # 第一层写入门控走哪个判断端点：laya / jev
    importance_threshold: 0.5 # 重要度阈值（0~1）；默认取保守值，宁多记勿漏记
    novelty_threshold: 0.5 # 新颖度阈值（0~1）
    skip_laya: false # true = 跳过第一层直接进 LLM，laya 不可用时的应急开关
  recall:
    top_k: 8 # 每张表各取多少条
    hops: 2 # 图多跳的跳数（1~3）
    budget: 2000 # 记忆块的字符预算
    block_by_llm: true # 记忆块交给 LLM 编排；false = 恒走确定性模板
  consolidate:
    enabled: true # false 时模块退化成纯写入 + 召回
    interval: 3600 # 定时循环周期（秒）
    min_events: 20 # 累积够多少条事件才触发一轮，避免空转
  decay:
    tau: 30 # 衰减常数（世界时间单位）
    floor: 0.05 # 跌破此值即删除；默认保守，宁留不删
  retry:
    max_attempts: 3 # 单条最多重试次数（首次不计）
    backoff: 1.0 # 退避基数（秒），按 backoff * 2^n 递增
    deadletter_path: data/memory/deadletter.jsonl # append-only，刻意独立于 Kùzu
