app:
  app_name: aliya-cosmos
  env: dev
  debug: true

log:
  level: INFO
  json: false
  dir: logs
  rotation: "00:00"
  retention: 7 days
  compression: zip

service:
  start_timeout: 30
  stop_timeout: 30

clock:
  tz: UTC

llm:
  chat:
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout: 60
    retries: 2
    structured_mode: json_schema
    temperature: null
    max_tokens: null
  vision:
    base_url: https://api.deepseek.com/v1
    api_key: ${DEEPSEEK_API_KEY:}
    model: deepseek-flash
    timeout: 60
    retries: 2
    structured_mode: json_schema
    temperature: null
    max_tokens: null
