# Aliya agent 配置样例
#
# 用法：把 agent.control 与 agent.aliya 整段并入 data/config/cosmos.yaml。
# 字段与 core/config/settings.py 的 AgentControlSettings / AgentAliyaSettings 对齐。
# 边界：本文件只表达 Aliya 自己的意愿、人设与记忆策略。
#       通道侧的节流（免打扰、最小间隔、每日上限）与链路状态由
#       agent.cosmos.terminal 执行，不要在这里重复配置，否则两处策略会打架。

agent:
  control:
    socket_path: data/state/aliya.sock
    token_env: ALIYA_CONTROL_TOKEN
    max_clients: 1
    request_timeout: 15
    outbox_limit: 200
    max_line_bytes: 1048576

  aliya:
    # ---------- 人设 ----------
    persona:
      source: data/prompt/Aliya.md # 人格正文唯一来源
      charter: data/prompt/Aliya.charter.md # 只取 visible 区进提示词
      includes: [] # 额外片段，按顺序拼在准则与人格之后

    # ---------- 记忆 ----------
    memory:
      enabled: true
      dir: data/Aliya # 不与 cosmos 的 data/state、data/memory 混用
      max_turns: 200
      summary_chars: 600
      open_topics_limit: 5
      anchors: [风信子, 拉姆石, 高马尾, 兔子狗, 海獭号]
      private_threads: true

    # ---------- 自主行动（意愿，不是通道策略）----------
    initiative:
      enabled: true
      tick_seconds: 60
      min_gap_seconds: 3600
      daily_soft_limit: 4
      # prefer_when 是自由文本，识别失眠、未收尾话题、修好、深夜刷信息四类动机。
      # 条件中的“N 小时”作为该类动机的间隔阈值；未识别条件退化为保守关键词匹配。
      prefer_when:
        - 失眠且对方超过 2 小时没来
        - 有未收尾的话题且距上次互动超过 6 小时
        - 刚修好某样东西，想被夸
        - 深夜刷信息刷到想说话
      respect_presence_hint: true
      respect_link_state: true
      # speak 只解除长安静/默认等待；配置了 prefer_when 时仍要命中语义条件。
      default_action: wait # wait / speak

    # ---------- 回复 ----------
    reply:
      max_rounds: 6
      turn_timeout_seconds: 120
      max_chars_per_message: 0 # 0 表示不截断；超过时由终端分段投递
      fallback_text: 回复失败，请稍后再试。 # 以 system 消息投递，不算 Aliya 的回复
      progress_forwarding: on_wait # always / on_wait / never
      post_checks: [narration, engineering_terms, internal_ids, presence_leak]

    # ---------- 工具偏好 ----------
    tools:
      prefer_agents: [edit, search, run, web]
      ask_before_write: true
      max_parallel_dispatch: 2
      mcp_enabled: true # data/mcp.json；空的 mcpServers 不连任何 server
      skills_enabled: true # data/skills/*/SKILL.md；只进索引，正文按需读取

    # ---------- 世界推理 ----------
    world:
      consume: true
      max_hypotheses_used: 2
      trust_threshold: 0.5
      provide_context: true
